server {
    listen 80;
    listen [::]:80;
    server_name marseloid.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://marseloid.online$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name marseloid.online;

    ssl_certificate /etc/letsencrypt/live/marseloid.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marseloid.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MarseloidSSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/marseloid.access.log;
    error_log /var/log/nginx/marseloid.error.log;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
